# T1 label-only MVP: Llama-3.2-1B Flamingo, warm-started from the OpenTSLM HAR-CoT checkpoint (the stage whose
# answers already end in "Answer: <label>"). All horizons, full Penmanshiel train/val, predictions on val + both tests.
# uv run python -m turbine_tslm.training.train configs/t1_flamingo_llama1b.yaml
run_name: t1_flamingo_llama1b
model_type: OpenTSLMFlamingo
llm_id: meta-llama/Llama-3.2-1B
init_checkpoint: OpenTSLM/llama-3.2-1b-har-flamingo
epochs: 5
batch_size: 4
eval_batch_size: 8
lr: 1.0e-4
warmup_frac: 0.03
early_stop_patience: 2
eval_splits: [val, test_a, test_b]
max_new_tokens: 24
score_method: loglik
checkpoint_every_steps: 100
