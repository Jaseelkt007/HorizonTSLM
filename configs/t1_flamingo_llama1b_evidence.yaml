# Stage 2: reason-first answers. Same model/data as t1_flamingo_llama1b, but the training target is the rule-based
# evidence paragraph (data/evidence.py) followed by the Answer line; prediction generates the text and scores the
# label candidates conditioned on the model's own evidence.
# uv run python -m turbine_tslm.training.train configs/t1_flamingo_llama1b_evidence.yaml
run_name: t1_flamingo_llama1b_evidence
model_type: OpenTSLMFlamingo
llm_id: meta-llama/Llama-3.2-1B
init_checkpoint: OpenTSLM/llama-3.2-1b-har-flamingo
answer_mode: evidence
evidence_sentences: 3
tasks: [t1, t3]   # early warning + post-hoc explanation rows (same windows, different prompt)
epochs: 5
batch_size: 8
eval_batch_size: 16
lr: 1.0e-4
warmup_frac: 0.03
early_stop_patience: 2
eval_splits: [val, test_a, test_b]
predict_mode: generate
max_new_tokens: 160
autocast_bf16: true
wandb_project: turbine-tslm
checkpoint_every_steps: 100
