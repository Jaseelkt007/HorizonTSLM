# RFT stage 2: one more epoch on the kept (label-correct, fully verified) sampled explanations, starting from the
# headline checkpoint. Stage 1 (sampling) writes outputs/rft/kept.jsonl — see training/rft.py.
# uv run python -m turbine_tslm.training.train configs/t1_flamingo_llama1b_evidence_rich_rft.yaml
run_name: t1_flamingo_llama1b_evidence_rich_rft
model_type: OpenTSLMFlamingo
llm_id: meta-llama/Llama-3.2-1B
init_checkpoint: /home/ubuntu/data/checkpoints/t1_flamingo_llama1b_evidence_rich/best.pt
answer_mode: evidence
evidence_sentences: 3
series_stats: rich
tasks: [t1, t3]
answers_from: outputs/rft/kept.jsonl
epochs: 1
batch_size: 4
eval_batch_size: 16
lr: 3.0e-5
warmup_frac: 0.05
early_stop_patience: 1
eval_splits: [val, test_a, test_b]
predict_mode: generate
max_new_tokens: 160
autocast_bf16: true
wandb_project: turbine-tslm
checkpoint_every_steps: 100
resume: false
