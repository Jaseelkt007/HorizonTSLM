# Init ablation: no OpenTSLM checkpoint at all — plain Llama-3.2-1B with a fresh encoder / perceiver / cross-attention
# (the mentor's "start from something neutral", taken literally). Needs more epochs than the warm starts.
# uv run python -m turbine_tslm.training.train configs/t1_flamingo_llama1b_fresh.yaml
run_name: t1_flamingo_llama1b_fresh
model_type: OpenTSLMFlamingo
llm_id: meta-llama/Llama-3.2-1B
init_checkpoint: null
epochs: 8
batch_size: 8
eval_batch_size: 16
lr: 2.0e-4
warmup_frac: 0.05
early_stop_patience: 3
eval_splits: [val, test_a, test_b]
predict_mode: loglik
autocast_bf16: true
wandb_project: turbine-tslm
checkpoint_every_steps: 100
