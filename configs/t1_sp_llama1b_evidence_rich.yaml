# Stage 2 on the soft-prompt model: OpenTSLM-SP + LoRA (the label-only SP run beat Flamingo on val/test_a) trained on
# the reason-first evidence targets, T1 + T3. Generate-mode prediction; SP sequences are long, so small score batches.
# uv run python -m turbine_tslm.training.train configs/t1_sp_llama1b_evidence.yaml
run_name: t1_sp_llama1b_evidence_rich
series_stats: rich   # first-6h / 6h-before-end / last-hour values in every channel text (window-only inputs)
model_type: OpenTSLMSP
llm_id: meta-llama/Llama-3.2-1B
init_checkpoint: OpenTSLM/llama-3.2-1b-har-sp
lora: true
answer_mode: evidence
evidence_sentences: 3
tasks: [t1, t3]
epochs: 5
batch_size: 2   # SP: 19x36 series tokens + rich channel text; batch 4 OOMs on 96 GB
eval_batch_size: 8
score_batch_size: 16
lr: 1.0e-4
warmup_frac: 0.03
early_stop_patience: 2
eval_splits: [val, test_a, test_b]
predict_mode: generate
max_new_tokens: 160
autocast_bf16: true
wandb_project: turbine-tslm
checkpoint_every_steps: 100
