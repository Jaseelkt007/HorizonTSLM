dataset_id: energy/kelmarsh-wind-scada
dataset_version: 1.0.0
name: Kelmarsh Wind Farm SCADA & Status Anomaly Dataset
description: >-
  Ten-minute multivariate SCADA telemetry and aligned operational status alarm logs
  from six Senvion MM92 wind turbines at Kelmarsh Wind Farm (UK). Prepared for
  time-series language model (TSLM) anomaly detection, physics-grounded root cause
  diagnosis (Chain-of-Thought), and predictive maintenance dispatch.
