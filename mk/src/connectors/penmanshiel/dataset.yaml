dataset_id: energy/penmanshiel-wind-scada
dataset_version: 1.0.0
name: Penmanshiel Wind Farm SCADA & Status Anomaly Dataset
description: >-
  Ten-minute multivariate SCADA telemetry and aligned operational status alarm logs
  from fourteen Senvion MM82 wind turbines at Penmanshiel Wind Farm (Scottish Borders, UK).
  Prepared for time-series language model (TSLM) anomaly detection, physics-grounded
  root cause diagnosis (Chain-of-Thought), and predictive maintenance dispatch.
