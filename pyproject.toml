[project]
name = "zurich-ehl-timeseries"
version = "0.1.0"
description = "Zurich hackathon time-series project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pyyaml>=6.0",
    "timenet[cli,torch]>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turbine_tslm"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.9", "jupyter>=1.0"]
